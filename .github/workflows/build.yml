name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download ffmpeg
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Write-Host "Downloading ffmpeg from $url ..."
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = Get-ChildItem ffmpeg_tmp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $bin) { Write-Error "ffmpeg.exe not found in archive"; exit 1 }
          New-Item -ItemType Directory -Force -Path tools/ffmpeg | Out-Null
          Copy-Item $bin.FullName tools/ffmpeg/ffmpeg.exe
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") tools/ffmpeg/ffprobe.exe
          Remove-Item ffmpeg.zip, ffmpeg_tmp -Recurse -Force
          Write-Host "ffmpeg.exe: $((Get-Item 'tools/ffmpeg/ffmpeg.exe').Length) bytes"
          Write-Host "ffprobe.exe: $((Get-Item 'tools/ffmpeg/ffprobe.exe').Length) bytes"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install openai-whisper
          playwright install chromium

      - name: Build exe
        run: python build/build.py --version ${{ github.ref_name }}

      - name: Get NSSM
        shell: pwsh
        run: |
          if (Test-Path "installer\nssm.exe") {
            $size = (Get-Item "installer\nssm.exe").Length
            Write-Host "nssm.exe found in repo ($size bytes)"
            if ($size -lt 200000) {
              Write-Host "WARNING: nssm.exe looks like a shim ($size bytes) — replacing with real binary"
              Remove-Item "installer\nssm.exe" -Force
            } else {
              Write-Host "nssm.exe OK"
              exit 0
            }
          }
          Write-Host "Installing NSSM via Chocolatey..."
          choco install nssm -y --no-progress
          # Get-Command returns the Chocolatey shim — find the real binary instead
          $real = Get-ChildItem "C:\ProgramData\chocolatey\lib\nssm" -Recurse -Filter "nssm.exe" |
                  Where-Object { $_.Length -gt 200000 } |
                  Sort-Object Length -Descending |
                  Select-Object -First 1
          if (-not $real) {
            Write-Error "Could not find real nssm.exe in Chocolatey lib — aborting"
            exit 1
          }
          Write-Host "Found real nssm.exe: $($real.FullName) ($($real.Length) bytes)"
          Copy-Item $real.FullName installer\nssm.exe
          Write-Host "nssm.exe ready: $((Get-Item 'installer\nssm.exe').Length) bytes"

      - name: Build installer
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\atana_setup.iss /DMyAppVersion=$version
        shell: pwsh

      - name: Upload Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ATANA Agents ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/exe/atana_dispatcher.exe
            dist/exe/build_info.json
            installer/Output/AtanaAgents_Setup_v*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
